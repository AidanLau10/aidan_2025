questions:
  - id: "unit10-recursive-factorial"
    title: "Factorial Recursion"
    question: "Write a recursive method `fact(int n)` that returns `n!`. Identify its base and recursive cases."
  - id: "unit10-recursion-trace"
    title: "Call Stack Tracing"
    question: "Trace the calls and returns for `fact(4)` and show the sequence of method invocations."
  - id: "unit10-base-case"
    title: "Ensuring Termination"
    question: "What happens if you omit the base case in a recursive method? Illustrate with an example."
  - id: "unit10-recursive-array-sum"
    title: "Recursive Array Processing"
    question: "Implement a method to compute the sum of an `int[]` recursively."
  - id: "unit10-recursion-vs-iteration"
    title: "Comparative Analysis"
    question: "Rewrite your recursive array-sum method using iteration. Compare time/space trade-offs."