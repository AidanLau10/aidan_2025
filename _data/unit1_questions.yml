questions:
  - id: "unit1-evaluate-expression"
    title: "Expression Evaluation"
    question: "Given `int x = 5 + 2 * 3;`, what is the value of `x`? Explain how operator precedence determines the result."
  - id: "unit1-integer-vs-floating"
    title: "Integer vs. Floating-Point Division"
    question: "What is the difference between `7 / 2` and `7.0 / 2` in Java? Provide example output and explain."
  - id: "unit1-operator-precedence"
    title: "Operator Precedence"
    question: "Reorder and parenthesize the expression `3 + 4 * 2 / (1 - 5) % 2` to make the evaluation order explicit, then evaluate it."
  - id: "unit1-casting-behavior"
    title: "Casting Rules"
    question: "Explain implicit vs. explicit casting. What happens when you write `(int) 3.9 + (double) 2`?"
  - id: "unit1-compile-error"
    title: "Compile-Time Errors"
    question: "Identify and fix the error in `final double PI = 3.14; PI = 3.1415;`. Why did it occur?"