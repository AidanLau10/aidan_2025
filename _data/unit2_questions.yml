questions:
  - id: "unit2-instantiate-objects"
    title: "Object Instantiation"
    question: "How do you create a new `Rectangle` object with width 5 and height 10? Show the constructor call."
  - id: "unit2-method-calls"
    title: "Calling Methods"
    question: "Given `String s = \"Hello\";`, write code to call `toUpperCase()` and store the result. What does the original `s` contain afterward?"
  - id: "unit2-constructor-overload"
    title: "Constructor Overloading"
    question: "Design two constructors for a `Point` class: one default at (0,0) and one taking `x` and `y`. Show both signatures."
  - id: "unit2-string-methods"
    title: "String API"
    question: "What does `s.substring(1, 4)` return when `s = \"abcdef\"`? Explain start/end indices."
  - id: "unit2-null-reference"
    title: "NullPointerException"
    question: "Why does this code throw a `NullPointerException`? `String t = null; int len = t.length();` How would you guard against it?"