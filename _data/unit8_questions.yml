questions:
  - id: "unit8-declare-2d-array"
    title: "2D Array Declaration"
    question: "Declare a 3×4 `int` 2D array and initialize all entries to zero."
  - id: "unit8-traverse-2d-array"
    title: "Traversal"
    question: "Write nested loops to print each element of a given `int[][] matrix`."
  - id: "unit8-ragged-array"
    title: "Jagged Arrays"
    question: "Create a ragged `String[][]` where row `i` has `i+1` elements, and fill with sample data."
  - id: "unit8-neighbor-count"
    title: "Neighbor Checks"
    question: "Given a grid of booleans, write code to count `true` neighbors of cell `(r, c)` safely."
  - id: "unit8-row-column-sum"
    title: "Row/Column Operations"
    question: "Compute the sum of each row and each column in an `int[][]` and store results in two arrays."
