questions:
  - id: "unit3-boolean-expression"
    title: "Building Boolean Expressions"
    question: "Write a boolean expression that is true if `x` is between 10 and 20 inclusive."
  - id: "unit3-truth-table"
    title: "Truth Tables"
    question: "Construct the truth table for `(A && !B) || (B && !A)`."
  - id: "unit3-if-else-flow"
    title: "`if-else` Control Flow"
    question: "Given `if (score >= 90) grade = 'A'; else if (score >= 80) grade = 'B'; else grade = 'C';`, what is `grade` when `score` is 85? Explain."
  - id: "unit3-logical-operators"
    title: "Logical Operators"
    question: "Explain the difference between `&&` and `&` in boolean expressions. When might you use one over the other?"
  - id: "unit3-parentheses"
    title: "Grouping Conditions"
    question: "How do parentheses affect evaluation in `a > b && b > c || c > d`? Add parentheses to evaluate `(a > b && (b > c || c > d))`."