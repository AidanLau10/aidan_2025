questions:
  - id: "unit7-arraylist-creation"
    title: "`ArrayList` Basics"
    question: "Show how to create an `ArrayList<String>` and add three names to it."
  - id: "unit7-add-remove"
    title: "Modifying Lists"
    question: "How do you remove the second element of an `ArrayList<Integer>` and why must you use `Integer.valueOf()`?"
  - id: "unit7-iterate-arraylist"
    title: "List Iteration"
    question: "Demonstrate both index-based and enhanced-for loops to print all elements of an `ArrayList<Double>`."
  - id: "unit7-array-to-arraylist"
    title: "Conversion"
    question: "Convert a `String[]` array to an `ArrayList<String>` in two different ways."
  - id: "unit7-dynamic-resizing"
    title: "Capacity vs. Size"
    question: "Explain how `ArrayList` manages capacity internally when adding elements beyond its current size."