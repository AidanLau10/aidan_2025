questions:
  - id: "unit6-array-declaration"
    title: "Array Declaration & Initialization"
    question: "Declare an `int` array of size 5 and initialize it with values 1–5 in one line."
  - id: "unit6-array-sum"
    title: "Summing Array Elements"
    question: "Write a loop to compute the sum of all elements in an `int[] nums` array."
  - id: "unit6-index-out-of-bounds"
    title: "Bounds Checking"
    question: "What exception is thrown by accessing `arr[ arr.length ]`? How do you avoid it?"
  - id: "unit6-array-reverse"
    title: "In-Place Reversal"
    question: "Implement a method that reverses a given `int[]` in place."
  - id: "unit6-single-element-array"
    title: "Edge-Case Handling"
    question: "How does your reversal method behave when given an array of length 1? Test and explain."