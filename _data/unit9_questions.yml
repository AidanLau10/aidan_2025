questions:
  - id: "unit9-inheritance-hierarchy"
    title: "Class Hierarchies"
    question: "Design a class hierarchy with `Animal` as superclass and `Dog`, `Cat` as subclasses. Show `extends` usage."
  - id: "unit9-overriding"
    title: "Method Overriding"
    question: "Override `speak()` in `Dog` and `Cat` classes. How does dynamic binding select the correct method?"
  - id: "unit9-super-constructor"
    title: "`super()` Calls"
    question: "In a subclass `Employee`, call the `Person(String name)` constructor. Show the `super(name)` syntax."
  - id: "unit9-polymorphism"
    title: "Polymorphic References"
    question: "Explain the output of `Animal a = new Dog(); a.speak();`. Why is this useful?"
  - id: "unit9-instanceof"
    title: "`instanceof` Checks"
    question: "When and how would you use `instanceof` before casting an `Object` to `String`?"