questions:
  - id: "unit4-for-loop"
    title: "`for` Loop Basics"
    question: "Write a `for` loop that prints the numbers 1 through 10, inclusive."
  - id: "unit4-while-loop"
    title: "`while` Loop Usage"
    question: "Convert the `for` loop from the previous question into a `while` loop."
  - id: "unit4-do-while-loop"
    title: "`do-while` Loop Differences"
    question: "Explain how a `do-while` loop differs from a `while` loop. Provide an example where `do-while` is preferred."
  - id: "unit4-nested-loops"
    title: "Nested Loop Traversal"
    question: "Using nested loops, print a 5×5 grid of asterisks (`*`)."
  - id: "unit4-off-by-one"
    title: "Off-By-One Errors"
    question: "Identify the off-by-one error in `for (int i = 0; i <= arr.length; i++) ...` and correct it."