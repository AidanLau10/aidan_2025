questions:
  - id: "unit5-define-class"
    title: "Class Definition"
    question: "Define a `Car` class with `make` and `year` fields and a constructor initializing both."
  - id: "unit5-access-modifiers"
    title: "Public vs. Private"
    question: "Why make fields `private` and provide `public` getters/setters? Illustrate with `speed` field."
  - id: "unit5-encapsulation"
    title: "Encapsulation Principle"
    question: "How does encapsulation help maintain invariants in a class? Give an example with a `BankAccount` balance."
  - id: "unit5-toString-equals"
    title: "`toString()` & `equals()`"
    question: "Override `toString()` and `equals()` for a `Point` class. Show method signatures and brief bodies."
  - id: "unit5-this-reference"
    title: "`this` Keyword"
    question: "Explain the use of `this` in distinguishing fields from parameters in a constructor like `this.x = x;`."